server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload file tối đa 20MB (khớp spring.servlet.multipart.max-file-size)
    client_max_body_size 21m;

    # Endpoint quản trị chỉ gọi trực tiếp tới backend (127.0.0.1:8010), không đi qua web
    location /api/v1/admin/ {
        return 404;
    }

    # Frontend chỉ gọi /api/...; nginx chuyển sang backend, không bao giờ tới vieneu-service.
    # Dùng biến + resolver để nginx vẫn khởi động được khi backend chưa sẵn sàng.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://tts-api:8010;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # SSE tiến trình và stream audio: không đệm, giữ kết nối lâu
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
