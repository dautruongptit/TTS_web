services:
  tts-web:
    container_name: tts-web
    image: tts-web:latest
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8020}:${WEB_PORT:-8020}"
    networks:
      - tts-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_PORT:-8020}/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tts-net:
    name: tts-net
    external: true
