name: tts-web

# Frontend (nginx + static build). Proxy /api -> tts-api:8010 trong network tts-net.
# Network tts-net do compose của repo api tạo, nên khởi động api trước (docker compose up -d ở repo api).
services:
  tts-web:
    build:
      context: .
    image: tts-web:latest
    container_name: tts-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:80"
    networks:
      - tts-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tts-net:
    name: tts-net
    external: true
